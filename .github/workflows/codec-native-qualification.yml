name: Native codec qualification

# Deliberately separate from release packaging: prove the codec dependency
# contract before declaring a platform's OBS plugin ready to distribute.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/codec/**'
      - 'cmake/common/RetroFFmpeg.cmake'
      - 'tests/codec-native/**'
      - 'tests/test-video-codecs.c'
      - 'tests/test-h263-roundtrip.c'
      - '.github/workflows/codec-native-qualification.yml'
      - '.github/scripts/qualify-native-codecs.py'

permissions:
  contents: read

jobs:
  codec:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: windows-deps-2026-07-15-x64.zip
            sha256: 6f90e9598fa10cff5ad23cdcfae49b87868c07bf896b02cd464582b4ce2f2ba9
            arch: x64
          - os: macos-15
            asset: macos-deps-2026-07-15-universal.tar.xz
            sha256: 4ecb4c598dfa853168df6c2a0c4e0ffec8495a81fbd1ba051ef88ecd5e0f7e53
            arch: arm64
          - os: macos-15-intel
            asset: macos-deps-2026-07-15-universal.tar.xz
            sha256: 4ecb4c598dfa853168df6c2a0c4e0ffec8495a81fbd1ba051ef88ecd5e0f7e53
            arch: x86_64
    runs-on: ${{ matrix.os }}
    name: OBS 32.2 codec SDK · ${{ matrix.os }} · ${{ matrix.arch }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify dependency archive and run actual codec tests
        run: python .github/scripts/qualify-native-codecs.py "${{ matrix.asset }}" "${{ matrix.sha256 }}" "${{ matrix.arch }}"
